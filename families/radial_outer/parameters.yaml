family: radial_outer
variant: RF16S-v2
units: mm

printer:
  name: kobra3max
  nozzle_mm: 0.4
  layer_mm: 0.2
  bed_x_mm: 420
  bed_y_mm: 420

clearance:
  press_mm: 0.15
  slide_mm: 0.30
  loose_mm: 0.45

poles: 16
pitch_deg: 22.5
air_gap_mm: 1.00

outer_magnet:
  dia_mm: 20.0
  thk_mm: 5.0
  grade: N52
  qty: 16
  faces: inward

inner_magnet:
  dia_mm: 5.0
  thk_mm: 5.0
  grade: N52
  qty: 48
  stack_per_pole: 3
  faces: outward

# Radial stack, shaft axis at r=0. Outer magnet FACE radius is the locked datum
# inherited from HF-RF16 / RF16S notes (56.38). Inner face = outer face
# minus both gaps minus cage radial thickness.
radii:
  outer_magnet_face_mm: 56.38
  cage_radial_thk_mm: 4.00
  # derived in code:
  # outer_magnet_back = face + 5.00 = 61.38
  # cage_outer = face - 1.00 = 55.38
  # cage_inner = cage_outer - 4.00 = 51.38
  # inner_magnet_face = cage_inner - 1.00 = 50.38
  # inner_magnet_back = face - 5.00 = 45.38

pockets:
  outer_dia_mm: 20.60   # 20 + 2*0.30
  outer_depth_mm: 5.35
  outer_lip_id_mm: 18.40
  inner_dia_mm: 5.60
  inner_depth_mm: 5.35

cage:
  windows: 16
  winding: wave
  wire_awg: 26
  target_turns: 100
  fill_factor: 0.55

shaft_d_mm: 8.0
bearing: 608ZZ

material:
  print: PETG
  forbid: [PLA]
  backiron_strip_mm: [1.5, 20.0]
