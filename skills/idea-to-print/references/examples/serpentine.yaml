# Example — serpentine

This is a **worked example**, not the process default. idea-to-print drives any generator that follows the contract; serpentine just happens to be the first one wired up.

```yaml
id: serpentine
repo: lucidlooney2030/serpentine-pm-generator
branch: serpentine-v1
kernel: openscad
param_file: params.yaml
emit: python3 generate_params.py
coupon_target: make coupon
all_target: make all
clean: make clean
parts: [coupon, outer, inner, coil, stand]
gate: python3 simulate.py
notes: |
  Dual-magnet axial, air-cored. Outer 16x Ø20x5 N52, inner 48x Ø5x5 N52
  (16 groups x 3 stack). Wave serpentine coil, 32 columns. 608 bearing on stand.
  Weave is even/odd columns, not zigzag. Air gap 1.0 mm (param).
```

Part roles: `coupon` = one outer pocket + one inner pocket + 608 seat + wall witness; `outer` / `inner` = rotors; `coil` = former; `stand` = stator + bearing.

After print, log designed vs measured in the generator's `DEBRIEF.md`. Next param tweak uses those deltas.
