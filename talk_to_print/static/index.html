<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Talk-to-Print</title>
<style>
  :root { --bg:#0b0d10; --ink:#e8edf2; --dim:#8b98a5; --acc:#6ee7c5; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 ui-sans-serif,system-ui; }
  #view { position:fixed; inset:0; }
  #hud { position:fixed; left:16px; top:16px; width:320px; background:rgba(20,24,30,.92); border:1px solid #2a333c; border-radius:14px; padding:16px; }
  h1 { font-size:15px; margin:0 0 10px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); }
  button,select { background:#1c232b; color:var(--ink); border:1px solid #2e3944; border-radius:8px; padding:8px 10px; cursor:pointer; }
  #talk { width:100%; margin:8px 0; background:#12352d; border-color:#2a6b5a; }
  #talk.hot { background:#0f6b52; }
  input[type=range] { width:100%; }
  label { display:block; color:var(--dim); font-size:12px; margin-top:8px; }
  #log { min-height:44px; color:var(--dim); font-size:13px; margin-top:8px; }
  #dl { display:inline-block; margin-top:10px; color:var(--acc); }
</style>
</head>
<body>
<div id="view"></div>
<div id="hud">
  <h1>Talk to print</h1>
  <button id="talk">hold or click — speak</button>
  <select id="part">
    <option value="outer">outer cup</option>
    <option value="inner">inner hub</option>
    <option value="cage">coil cage</option>
    <option value="cap">stator cap</option>
  </select>
  <label>air gap <span id="agv">1.00</span> mm</label>
  <input id="ag" type="range" min="0.5" max="2.5" step="0.05" value="1.00"/>
  <label>spine width <span id="swv">6.0</span> mm</label>
  <input id="sw" type="range" min="3.5" max="12" step="0.5" value="6.0"/>
  <div id="log">Say “show the inner” or “air gap 1.2”.</div>
  <a id="dl" href="/stl/RF16S-OUTER.stl" download>download STL</a>
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0b0d10);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(90, 70, 110);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(40, 80, 30); scene.add(key);
scene.add(new THREE.GridHelper(200, 20, 0x243018, 0x161b20));
let mesh;
const loader = new STLLoader();
function loadSTL(url) {
  loader.load(url, geo => {
    geo.center();
    const next = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0xb7c2cc, metalness:0.15, roughness:0.55 }));
    if (mesh) scene.remove(mesh);
    mesh = next; scene.add(mesh);
  });
}
async function api(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  return r.json();
}
const log = document.getElementById('log');
const partSel = document.getElementById('part');
const ag = document.getElementById('ag');
const sw = document.getElementById('sw');
async function rebuild() {
  log.textContent = 'rebuilding…';
  const p = await (await fetch('/api/params')).json();
  Object.assign(p, { part: partSel.value, air_gap_mm: +ag.value, spine_w_mm: +sw.value });
  const res = await api('/api/rebuild', p);
  loadSTL(res.stl);
  document.getElementById('dl').href = res.stl;
  log.textContent = res.note || 'ready';
}
ag.oninput = () => document.getElementById('agv').textContent = (+ag.value).toFixed(2);
sw.oninput = () => document.getElementById('swv').textContent = (+sw.value).toFixed(1);
let t; function bounce() { clearTimeout(t); t = setTimeout(() => rebuild(), 400); }
ag.onchange = bounce; sw.onchange = bounce; partSel.onchange = () => rebuild();
async function applySpeech(text) {
  log.textContent = '\u201c' + text + '\u201d';
  const res = await api('/api/say', { text });
  partSel.value = res.params.part;
  ag.value = res.params.air_gap_mm;
  sw.value = res.params.spine_w_mm;
  document.getElementById('agv').textContent = (+ag.value).toFixed(2);
  document.getElementById('swv').textContent = (+sw.value).toFixed(1);
  loadSTL(res.stl);
  document.getElementById('dl').href = res.stl;
  log.textContent = res.note;
}
const talk = document.getElementById('talk');
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Rec) {
  const rec = new Rec();
  rec.lang = 'en-US'; rec.interimResults = false;
  rec.onresult = e => applySpeech(e.results[0][0].transcript);
  rec.onend = () => talk.classList.remove('hot');
  talk.onclick = () => { talk.classList.add('hot'); rec.start(); };
} else {
  talk.textContent = 'type a command — speech needs Chrome';
  talk.onclick = () => { const t = prompt('command'); if (t) applySpeech(t); };
}
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop(){ controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
rebuild();
</script>
</body>
</html>
